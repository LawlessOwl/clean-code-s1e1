<!DOCTYPE html>
  <html>
    <head>
      <title>Todo App</title>
      <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
      <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
    </head>
    <body class="page-body">
      <div class="matrix-image-wrapper">
          <img src="./eisenhower-matrix.jpg" alt="eisenhower matrix image" class="matrix-image">
          <a class="more-inf" 
            href="https://goal-life.com/page/method/matrix-eisenhower"
          >
            Want more details?
          </a>
      </div>
      <div class="new-task-wrapper">
          <p id="add-task-section">
            <label for="new-task-label">Add Item</label>
            <div class="task-row-wrapper">
                <input id="new-task" class="new-task-input-field" type="text">
                <button class="task-add-button">Add</button>
            </div>
          </p>
      </div>
      <h3 class="active-tasks-title">Todo</h3>
      <ul id="active-tasks-list">
        <li class="active-task-item">
            <input type="checkbox" class="task-checkbox">
            <label class="task">Pay Bills</label>
            <input type="text" class="task-input-field">
            <button class="edit-task-button">Edit</button>
            <button class="delete-task-button">
                <img src="./remove.svg" alt="remove button svg" class="delete-button-img">
            </button>
        </li>
        <li class="active-task-item">
            <input type="checkbox" class="task-checkbox">
            <label class="task">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task-input-field">
            <button class="edit-task-button">Save</button>
            <button class="delete-task-button">
                <img src="./remove.svg" alt="remove button svg" class="delete-button-img">
            </button>
        </li>
      </ul>
      <h3 class="completed-task-title">Completed</h3>
      <ul id="completed-tasks-list">
          <li class="completed-task-item">
              <input type="checkbox" class="task-checkbox" checked>
              <label class="task">See the Doctor</label>
              <input type="text" class="task-input-field">
              <button class="edit-task-button">Edit</button>
              <button class="delete-task-button">
                  <img src="./remove.svg" alt="remove button svg" class="delete-button-img">
              </button>
          </li>
      </ul>
      </div>
      <script src="app.js"></script>
    </body>
</html>
